name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dist:
    uses: ./.github/workflows/native-wheels.yml

  verify-release:
    name: Verify release candidate metadata
    needs: native-dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Verify tag, version, candidate, and artifact identity
        if: github.event_name == 'push'
        run: >-
          python scripts/verification/check_release_metadata.py
          --artifact-dir dist/packages
          --ref "${{ github.ref }}"
          --sha "${{ github.sha }}"
      - name: Verify branch dry-run candidate and artifact identity
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python scripts/verification/check_release_metadata.py
          --artifact-dir dist/packages
          --ref "${{ github.ref }}"
          --sha "${{ github.sha }}"
          --allow-dry-run-ref
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: |
            dist/artifacts.json
            dist/SHA256SUMS
          if-no-files-found: error

  pypi:
    name: Upload exact artifacts to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native-dist, verify-release]
    runs-on: ubuntu-24.04
    # PyPI 发布不是本工作流的必要条件：fork 上通常没有配置 Trusted Publisher，
    # 这里会失败。用 continue-on-error 让它不把整轮 run 判为失败。
    # 注意：真正保证 GitHub Release 仍会被创建的是 release job 上显式的 if 门，
    # 而不是这个开关——不要只依赖 continue-on-error 的 needs 语义。
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/p/eltdx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Upload to PyPI after independent environment approval
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/
          # Re-running a tag workflow should remain green when the immutable
          # files are already present on PyPI.
          skip-existing: true

  release:
    name: Create GitHub Release from exact artifacts
    needs: [native-dist, verify-release, pypi]
    # 显式门：只要求「构建」与「校验」成功，pypi 的成败与本 job 无关。
    # 必须写 always() 覆盖默认的 success() 门，否则 pypi 失败时这里会被跳过，
    # 结果就是既没发上 PyPI、也拿不到 GitHub Release。
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.native-dist.result == 'success'
      && needs.verify-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Prepare release notes
        run: >-
          python scripts/release/prepare_release_notes.py
          --tag "${{ github.ref_name }}"
          --output RELEASE_NOTES.md
      - name: Create release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/packages/* dist/SHA256SUMS
          --verify-tag
          --title "${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
